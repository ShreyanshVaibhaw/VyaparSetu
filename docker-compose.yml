version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: vyaparsetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vyaparsetu
      POSTGRES_USER: vyaparsetu
      POSTGRES_PASSWORD: vyaparsetu2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vyaparsetu_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyaparsetu -d vyaparsetu"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vyaparsetu-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - vyaparsetu_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: vyaparsetu-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - vyaparsetu_net
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    container_name: vyaparsetu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - vyaparsetu_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  vyaparsetu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vyaparsetu-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_HOST: ollama
      OLLAMA_PORT: "11434"
      POSTGRES_URI: postgresql://vyaparsetu:vyaparsetu2026@postgres:5432/vyaparsetu
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vyaparsetu_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:

networks:
  vyaparsetu_net:
    driver: bridge
